# Model routing config. Model IDs live ONLY here — never in code.
# Candidate format: "<provider>/<model>", tried in order per quality tier.

transcription:
  whisper_model: base        # faster-whisper model name

search:                # ordered candidates; first available wins
  candidates: ["tavily", "duckduckgo"]
  tavily:
    api_key_env: TAVILY_API_KEY   # env var NAME, never a literal key

tasks:
  chaptering:
    cheap:    ["ollama/llama3.1:8b", "openai/gpt-4o-mini"]
    balanced: ["ollama/llama3.1:8b", "anthropic/claude-haiku-4-5"]
    best:     ["anthropic/claude-sonnet-5"]
  synthesis:
    cheap:    ["openai/gpt-4o-mini", "anthropic/claude-haiku-4-5"]
    balanced: ["anthropic/claude-sonnet-5", "openai/gpt-4o"]
    best:     ["anthropic/claude-opus-5", "openai/gpt-4o"]
  visual_description:
    best:     ["anthropic/claude-sonnet-5", "openai/gpt-4o"]
  factcheck:
    cheap:    ["ollama/llama3.1:8b", "openai/gpt-4o-mini"]
    balanced: ["anthropic/claude-haiku-4-5", "openai/gpt-4o-mini"]
    best:     ["anthropic/claude-sonnet-5"]

fact_check:            # bounded-loop caps (cost control)
  max_claims: 8
  max_steps: 3
  results_per_search: 5

pricing:  # USD per million tokens; local models omitted (cost 0)
  openai/gpt-4o-mini: {input_per_mtok: 0.15, output_per_mtok: 0.60}
  openai/gpt-4o: {input_per_mtok: 2.50, output_per_mtok: 10.00}
  anthropic/claude-haiku-4-5: {input_per_mtok: 1.00, output_per_mtok: 5.00}
  anthropic/claude-sonnet-5: {input_per_mtok: 3.00, output_per_mtok: 15.00}
  anthropic/claude-opus-5: {input_per_mtok: 5.00, output_per_mtok: 25.00}

visual:              # frame-sampling defaults for the Visual agent
  scene_threshold: 0.4
  max_frames: 24
  min_interval_s: 8
