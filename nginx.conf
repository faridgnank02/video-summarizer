events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500M;   # video/audio uploads

    # Docker's embedded DNS. Re-resolving upstreams at request time (via the
    # variables below) avoids nginx caching a stale container IP after api/mcp
    # are recreated on a rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA static assets + client-side routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # FastAPI (JSON + SSE). Buffering off so SSE events flush immediately.
        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # MCP Streamable-HTTP. Preserve /mcp; buffering off for streamed responses.
        location /mcp {
            set $mcp_upstream http://mcp:8000;
            proxy_pass $mcp_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }
    }
}
